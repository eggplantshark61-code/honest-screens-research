name: Discord Notifications
'on':
  push:
    branches:
    - main
    paths:
    - index.html
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode: prefix messages with TEST and skip the everyone ping'
        required: false
        default: true
        type: boolean
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Detect changed sections and notify Discord
      env:
        DISCORD_WEBHOOK_GENERAL: ${{ secrets.DISCORD_WEBHOOK_GENERAL }}
        DISCORD_WEBHOOK_REPORTS: ${{ secrets.DISCORD_WEBHOOK_REPORTS }}
        DISCORD_WEBHOOK_BUYS: ${{ secrets.DISCORD_WEBHOOK_BUYS }}
        DISCORD_WEBHOOK_SELLS: ${{ secrets.DISCORD_WEBHOOK_SELLS }}
        DISCORD_WEBHOOK_POSITION_CHANGES: ${{ secrets.DISCORD_WEBHOOK_POSITION_CHANGES }}
        SITE_URL: https://honest-screens-research.netlify.app/
        COMMIT_MSG: ${{ github.event.head_commit.message }}
        COMMIT_URL: ${{ github.event.head_commit.url }}
        REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        TEST_MODE: ${{ github.event.inputs.test_mode }}
      run: "set -e\nif git rev-parse HEAD~1 >/dev/null 2>&1; then\n  DIFF=$(git diff HEAD~1 HEAD -- index.html || true)\nelse\n  DIFF=\"\"\nfi\nADDED=$(echo \"$DIFF\" | grep '^+' | grep -v '^+++' || true)\nPREFIX=\"\"\nPING=\"@everyone\"\nif [ \"$TEST_MODE\" = \"true\" ]; then\n  PREFIX=\"[TEST] \"\n  PING=\"(test run - no ping)\"\nfi\nSUMMARY=\"${COMMIT_MSG:-Site updated}\"\nLINK=\"${COMMIT_URL:-$REPO_URL}\"\nsend_discord() {\n  WEBHOOK_URL=\"$1\"\n  TITLE=\"$2\"\n  DESCRIPTION=\"$3\"\n  PAGE_LINK=\"$4\"\n  if [ -z \"$WEBHOOK_URL\" ]; then\n    echo \"No webhook configured for: $TITLE (skipping)\"\n    return\n  fi\n  CONTENT=\"${PREFIX}${PING} -- ${TITLE}\"\n  PAYLOAD=$(jq -n --arg content \"$CONTENT\" --arg title \"$TITLE\" --arg desc \"$DESCRIPTION\" --arg url \"$PAGE_LINK\" --arg commiturl \"$LINK\" '{content: $content, embeds: [{title: $title, url: $url, description: $desc, color: 4886754, fields: [{name: \"Commit\", value: $commiturl}]}], allowed_mentions: {parse: [\"everyone\"]}}')\n  curl -sS -X POST -H \"Content-Type: application/json\" -d \"$PAYLOAD\" \"$WEBHOOK_URL\"\n}\nMATCHED=\"false\"\nif echo \"$ADDED\" | grep -q 'var reports=' || echo \"$ADDED\" | grep -q 'var cards=' || echo \"$ADDED\" | grep -q 'sub:'; then\n  MATCHED=\"true\"\n  send_discord \"$DISCORD_WEBHOOK_REPORTS\" \"New research posted\" \"$SUMMARY\" \"${SITE_URL}#research\"\nfi\nif echo \"$ADDED\" | grep -q 'var portfolio=' || echo \"$ADDED\" | grep -q 'ticker:'; then\n  MATCHED=\"true\"\n  send_discord \"$DISCORD_WEBHOOK_POSITION_CHANGES\" \"Current holdings updated\" \"$SUMMARY\" \"$SITE_URL\"\nfi\nif echo \"$ADDED\" | grep -q 'var updates=' || echo \"$ADDED\" | grep -qE \"tag:['\\\"]\"; then\n  MATCHED=\"true\"\n  if echo \"$ADDED\" | grep -qiE 'sold|trimmed|exit|sell'; then\n    send_discord \"$DISCORD_WEBHOOK_SELLS\" \"Position log updated (sell)\" \"$SUMMARY\" \"$SITE_URL\"\n  elif echo \"$ADDED\" | grep -qiE 'added|bought|buy|opened'; then\n    send_discord \"$DISCORD_WEBHOOK_BUYS\" \"Position log updated (buy)\" \"$SUMMARY\" \"$SITE_URL\"\n  else\n    send_discord \"$DISCORD_WEBHOOK_BUYS\" \"Position log updated\" \"$SUMMARY (check site for buy/sell detail)\" \"$SITE_URL\"\n    send_discord \"$DISCORD_WEBHOOK_SELLS\" \"Position log updated\" \"$SUMMARY (check site for buy/sell detail)\" \"$SITE_URL\"\n  fi\nfi\nif echo \"$ADDED\" | grep -qE '<title>|meta name=\\\"description\\\"|id=\\\"about\\\"|id=\\\"faq\\\"|class=\\\"disc\\\"|<footer>'; then\n  MATCHED=\"true\"\n  send_discord \"$DISCORD_WEBHOOK_GENERAL\" \"Website updated\" \"$SUMMARY\" \"$SITE_URL\"\nfi\nif [ \"$MATCHED\" = \"false\" ]; then\n  echo \"No tracked section changed in this push; nothing sent.\"\nfi\n"
